# TRM minimal test: detached recursions

project: coconut
save_path: outputs/
name: gsm-qwen-trm-test

only_eval: False

coconut: True
cot: False
no_thoughts: False
no_cot: False

c_thought: 2
epochs_per_stage: 1
max_latent_stage: 4
pad_latent_to_max: True

replacement_method: "-1"
save_only_improve: True
uniform_prob: 0.0

# TRM experiment: 2 detached recursions before final gradient pass
n_detached_recursions: 2

model_id: Qwen/Qwen2.5-Coder-0.5B
load_model_path: null
seed: 0
resume: 0

bf16: True
bf16_weight: False

train_path: data/gsm_train.json
val_path: data/gsm_valid.json

reset_optimizer: False
batch_size_training: 6  # Reduced from 10 due to memory
max_size: 20000  # Quick test on subset
debug: False

gradient_accumulation_steps: 4
num_epochs: 50  # Just a few epochs for quick test
lr: 0.0001
weight_decay: 0.01
system_prompt: |
  Reason about the math question with CoT steps in << and >> tags or, if you are given <|start-latent|><|end-latent|> tags as part of the question, then you can think silently inside. Then return the final answer after ###, for example 
  <<5^0+1*2=?>>
  <<1+2=3>>
  ### 3
