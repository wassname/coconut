# need 4 gpus

project: coconut
save_path: outputs/
name: gsm-qwen

only_eval: False

coconut: True
cot: False
no_thoughts: False
no_cot: False

c_thought: 2
num_epochs: 26
cot_epochs: 6
epochs_per_stage: 5
max_latent_stage: 3
pad_latent_to_max: True
loss_seq_vcr: False

# replacement_method: "-1"
# replacement_method: "-2"
# replacement_method: "0.5"
replacement_method: "ie+supressed[0.5:]"
# replacement_method: "hs+supressed[0.5:]"
# replacement_method: "supressed[0.5:]"

save_only_improve: True
uniform_prob: 0.0
model_id: Qwen/Qwen3-0.6B
load_model_path: 
seed: 0
resume: 0
opt_8b: True
bf16: True
bf16_weight: False
train_path: data/gsm_train.json
val_path: data/gsm_valid.json
reset_optimizer: False
batch_size_training: 13
max_size: 20000 # in verl 8k is enougth https://github.com/volcengine/verl/blob/main/examples/ppo_trainer/verl_getting_started.ipynb
debug: False
grad_clip: 10.0
gradient_accumulation_steps: 10

lr: !!float "1e-4" 
# system_prompt: |
#   Solve the math question by multiple short reasoning steps like `<<5*0+1*2=?>>` OR silently within `<|start-latent|><|end-latent|>`. Then return the final answer like `### 2`. No other preamble or comments are allowed.
weight_decay: 0.0
